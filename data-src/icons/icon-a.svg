<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 案A: overlapping cards (slightly tilted) + chopsticks resting beside them.
       Full bleed, no corner radius; the drawing stays inside the centre 80% circle. -->
  <rect width="512" height="512" fill="#d9480f"/>
  <g transform="rotate(-14 232 262)">
    <rect x="126" y="136" width="200" height="252" rx="22" fill="#ffd8bd"/>
  </g>
  <g transform="rotate(6 232 262)">
    <rect x="140" y="128" width="200" height="252" rx="22" fill="#ffffff"/>
    <rect x="160" y="148" width="160" height="128" rx="12" fill="#f5a623"/>
    <circle cx="206" cy="204" r="26" fill="#fff4e0"/>
    <rect x="160" y="296" width="120" height="16" rx="8" fill="#e9dccf"/>
    <rect x="160" y="326" width="84" height="16" rx="8" fill="#e9dccf"/>
  </g>
  <!-- chopsticks: tapered, from the lower right upwards -->
  <g fill="#3b2418">
    <polygon points="0,-9 300,-4.5 300,4.5 0,9" transform="translate(318 420) rotate(-70)"/>
    <polygon points="0,-9 300,-4.5 300,4.5 0,9" transform="translate(350 428) rotate(-74)"/>
  </g>
</svg>
